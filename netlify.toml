[build]
  base = "backend"
  command = "npm install"
  publish = "."

[build.environment]
  NODE_VERSION = "18"
  # Configure secrets scanning via env vars (comma-separated)
  SECRETS_SCAN_OMIT_KEYS = "PROMPT_ADMIN_KEY"
  SECRETS_SCAN_OMIT_PATHS = "**/node_modules/**"
  SECRETS_SCAN_ENABLED = "true"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200 