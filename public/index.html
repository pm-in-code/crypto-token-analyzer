<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="description"
      content="Crypto Token Analyzer - Get detailed analysis reports for any cryptocurrency token"
    />
    <title>Crypto Token Analyzer</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#eff6ff',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
              },
              crypto: {
                green: '#00ff88',
                red: '#ff4444',
                yellow: '#ffbb33',
              }
            },
            animation: {
              'spin-slow': 'spin 2s linear infinite',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          },
        }
      }
    </script>
    
    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- jsPDF CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Stripe.js -->
    <script src="https://js.stripe.com/v3/"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Custom styles -->
    <style>
      .btn-primary {
        background: linear-gradient(135deg, #3b82f6, #2563eb, #1d4ed8);
        color: white;
        font-weight: bold;
        padding: 1rem 2rem;
        border-radius: 0.75rem;
        transition: all 0.3s;
        outline: none;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        position: relative;
        overflow: hidden;
        background-size: 200% 200%;
        animation: gradient-shift 3s ease infinite;
        border: none;
        cursor: pointer;
      }
      
      .btn-primary:hover {
        background: linear-gradient(135deg, #2563eb, #1d4ed8, #1e40af);
        transform: translateY(-0.25rem);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }
      
      .btn-primary:active {
        transform: scale(0.95);
      }
      
      .btn-primary:focus {
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.3), 0 0 0 2px white;
      }
      
      .btn-primary::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: left 0.5s;
      }
      
      .btn-primary:hover::before {
        left: 100%;
      }
      
      .btn-secondary {
        background: linear-gradient(135deg, #f9fafb, #f3f4f6, #e5e7eb);
        color: #1f2937;
        font-weight: bold;
        padding: 1rem 2rem;
        border-radius: 0.75rem;
        transition: all 0.3s;
        outline: none;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        position: relative;
        overflow: hidden;
        background-size: 200% 200%;
        animation: gradient-shift 4s ease infinite;
        border: 1px solid #d1d5db;
        cursor: pointer;
      }
      
      .btn-secondary:hover {
        background: linear-gradient(135deg, #f3f4f6, #e5e7eb, #d1d5db);
        transform: translateY(-0.25rem);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }
      
      .btn-secondary:active {
        transform: scale(0.95);
      }
      
      .btn-secondary:focus {
        box-shadow: 0 0 0 4px rgba(107, 114, 128, 0.3), 0 0 0 2px white;
      }
      
      .btn-secondary::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(0,0,0,0.05), transparent);
        transition: left 0.5s;
      }
      
      .btn-secondary:hover::before {
        left: 100%;
      }
      
      .btn-success {
        background: linear-gradient(135deg, #10b981, #059669, #047857);
        color: white;
        font-weight: bold;
        padding: 1rem 2rem;
        border-radius: 0.75rem;
        transition: all 0.3s;
        outline: none;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        position: relative;
        overflow: hidden;
        background-size: 200% 200%;
        animation: gradient-shift 3s ease infinite;
        border: none;
        cursor: pointer;
      }
      
      .btn-success:hover {
        background: linear-gradient(135deg, #059669, #047857, #065f46);
        transform: translateY(-0.25rem);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }
      
      .btn-success:active {
        transform: scale(0.95);
      }
      
      .btn-success:focus {
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.3), 0 0 0 2px white;
      }
      
      .btn-success::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: left 0.5s;
      }
      
      .btn-success:hover::before {
        left: 100%;
      }
      
      @keyframes gradient-shift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      
      .btn-scan {
        background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
        color: white;
        font-weight: bold;
        padding: 1rem 2rem;
        border-radius: 0.75rem;
        transition: all 0.3s;
        outline: none;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        position: relative;
        overflow: hidden;
        background-size: 200% 200%;
        animation: gradient-shift 2s ease infinite;
        border: none;
        cursor: pointer;
      }
      
      .btn-scan:hover {
        background: linear-gradient(135deg, #4f46e5, #7c3aed, #db2777);
        transform: translateY(-0.25rem);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }
      
      .btn-scan:active {
        transform: scale(0.95);
      }
      
      .btn-scan:focus {
        box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.3), 0 0 0 2px white;
      }
      
      .btn-scan::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        transition: left 0.6s;
      }
      
      .btn-scan:hover::before {
        left: 100%;
      }
      
      .btn-scan:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        animation: none;
      }
      
      .btn-scan:disabled::before {
        display: none;
      }
      
      .btn-premium {
        background: linear-gradient(135deg, #f59e0b, #d97706, #b45309);
        color: white;
        font-weight: bold;
        padding: 1rem 2rem;
        border-radius: 0.75rem;
        transition: all 0.3s;
        outline: none;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        position: relative;
        overflow: hidden;
        background-size: 200% 200%;
        animation: gradient-shift 2.5s ease infinite;
        border: none;
        cursor: pointer;
      }
      
      .btn-premium:hover {
        background: linear-gradient(135deg, #d97706, #b45309, #92400e);
        transform: translateY(-0.25rem);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }
      
      .btn-premium:active {
        transform: scale(0.95);
      }
      
      .btn-premium:focus {
        box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.3), 0 0 0 2px white;
      }
      
      .btn-premium::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        transition: left 0.6s;
      }
      
      .btn-premium:hover::before {
        left: 100%;
      }
      
      .input-field {
        @apply w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-colors duration-200;
      }
      
      .card {
        @apply bg-white rounded-xl shadow-lg p-6 border border-gray-100;
      }
      
      /* Hide scrollbar for webkit browsers */
      .scrollbar-hide {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;  /* Chrome, Safari and Opera */
      }
      
      /* Smooth scrolling */
      .scrollbar-hide {
        scroll-behavior: smooth;
      }
      
      /* Enhanced hover animations */
      .group:hover .group-hover\:scale-110 {
        transform: scale(1.1);
      }
      
      .group:hover .group-hover\:scale-105 {
        transform: scale(1.05);
      }
      
      .group:hover .group-hover\:-translate-y-1 {
        transform: translateY(-0.25rem);
      }
      
      /* Auto-scroll container styles */
      .auto-scroll-container {
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
      }
      
      .auto-scroll-container::-webkit-scrollbar {
        display: none;
      }
      
      /* Ensure flex items don't shrink */
      .flex-shrink-0 {
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <!-- App Script -->
    <script type="text/babel" src="app.js?v=16"></script>
  </body>
</html>
