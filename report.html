<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Token Analysis Report</title>
    <style>
      html, body { margin: 0; padding: 0; background: #f3f4f6; }
      .fallback { max-width: 900px; margin: 40px auto; padding: 24px; background: white; border-radius: 12px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Helvetica, Arial, sans-serif; }
      .fallback h1 { margin: 0 0 12px; font-size: 20px; }
      .fallback p { color: #374151; }
      .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; background: #111827; color: #fff; border-radius: 9999px; border: none; cursor: pointer; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="fallback" class="fallback" style="display:none">
      <h1>Unable to render report automatically</h1>
      <p>Click the button below to open the report content. You can then use your browser’s Print dialog to save as PDF.</p>
      <button id="openBtn" class="btn">Open Report</button>
    </div>
    <script>
      (function () {
        var html = null;
        var title = null;
        try {
          html = sessionStorage.getItem('itsworth_report_html') || localStorage.getItem('itsworth_report_html');
          title = sessionStorage.getItem('itsworth_report_title') || localStorage.getItem('itsworth_report_title');
        } catch (e) {}

        if (title) { document.title = title; }

        if (html) {
          document.documentElement.style.background = '#fff';
          document.body.innerHTML = html;
          // Load html2pdf and wire the Download button since innerHTML won't execute scripts
          function wirePdf() {
            try {
              var btn = document.getElementById('downloadBtn');
              if (!btn) return;
              btn.addEventListener('click', function () {
                var opt = {
                  margin: 0,
                  filename: (document.title || 'token-analysis') + '.pdf',
                  image: { type: 'jpeg', quality: 0.95 },
                  html2canvas: { scale: 2, useCORS: true },
                  jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                  pagebreak: { mode: ['css','legacy'], before: '.page' }
                };
                if (window.html2pdf) {
                  window.html2pdf().set(opt).from(document.body).save();
                } else {
                  window.print();
                }
              });
            } catch (e) {}
          }
          var s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js';
          s.onload = wirePdf;
          document.head.appendChild(s);
        } else {
          document.getElementById('fallback').style.display = 'block';
          document.getElementById('openBtn').onclick = function () {
            var h = prompt('Paste report HTML');
            if (h) {
              document.body.innerHTML = h;
            }
          };
        }
      })();
    </script>
  </body>
  </html>
